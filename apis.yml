aid: manage-bgl
name: Manage BGL
description: >-
  Manage BGL is the diabetes-management platform from Jade Diabetes, a Melbourne,
  Australia company whose iOS and Android app helps people with Type 1, Type 1.5,
  Type 2, gestational, and LADA diabetes track blood glucose levels and calculate
  insulin doses. Jade tracks 64 types of diabetes data, calculates doses from
  carbohydrates, protein, fat, fiber, insulin-on-board and personalized factors,
  and offers a prediction engine that forecasts blood sugar hours ahead. It
  integrates with Dexcom, FreeStyle Libre, NightScout, fitness and food apps, and
  more than 60 diabetic devices, and supports live data sharing with care teams
  for remote patient monitoring. Jade exposes a public REST API (v1.0) so
  developers and partners can read and write diabetes data securely.
